        @media (max-width: 430px) {

        function setQrStatus(msg) { if (qrStatus) qrStatus.textContent = msg || ''; }

        function closeQrModal() { qrModal.style.display = 'none'; qrModal.setAttribute('aria-hidden','true'); }
        function resetReader() { reader.innerHTML = '<div class="scan-box"></div>'; }
        function isSecureCameraContext() { return location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1'; }
        scanBtn.addEventListener('click', startScanner);
        closeQrBtn.addEventListener('click', stopScanner);
        async function startScanner() {
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { showToast('Trình duyệt không hỗ trợ camera.'); return; }
            if (!isSecureCameraContext()) { showToast('Camera cần HTTPS hoặc localhost.'); return; }
            await stopScanner(false);
            openQrModal(); resetReader(); setQrStatus('Đang xin quyền camera...'); scanActive = true;
            if (window.Html5Qrcode) {
                try {
                    setQrStatus('Đang quét bằng html5-qrcode...');
                    html5QrcodeScanner = new Html5Qrcode('reader');
                    await html5QrcodeScanner.start({ facingMode: { ideal: 'environment' } }, { fps: 12, qrbox: (w,h)=>{ const s=Math.floor(Math.min(w,h)*0.72); return { width:s, height:s }; }, aspectRatio: 1.777 }, onQrDecoded, ()=>{});
                    return;
                } catch(e) {
                    console.warn('Html5Qrcode failed, fallback scanner:', e);
                    try { if (html5QrcodeScanner) await html5QrcodeScanner.clear(); } catch(_e){}
                    html5QrcodeScanner = null; resetReader();
                }
            }
            await startFallbackScanner();
        }
        async function startFallbackScanner() {
            setQrStatus(window.BarcodeDetector ? 'Đang quét bằng BarcodeDetector...' : (window.jsQR ? 'Đang quét bằng jsQR offline...' : 'Thiếu thư viện đọc QR. Cần jsQR.min.js hoặc html5-qrcode.min.js.'));
            if (!window.BarcodeDetector && !window.jsQR) throw new Error('Thiếu thư viện QR');
            scanStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal:'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio:false });
            const video = document.createElement('video'); video.setAttribute('playsinline',''); video.muted = true; video.autoplay = true; video.srcObject = scanStream;
            const canvas = document.createElement('canvas'); const ctx = canvas.getContext('2d', { willReadFrequently:true });

            await video.play().catch(()=>{});
            let detector = null;
            if (window.BarcodeDetector) { try { detector = new BarcodeDetector({ formats:['qr_code'] }); } catch(e) { detector = null; } }
            const loop = async () => {
                if (!scanActive) return;

                    if (video.readyState >= 2) {
                        if (detector) {
                            const codes = await detector.detect(video);

                        } else if (window.jsQR) {
                            const w = video.videoWidth || 640, h = video.videoHeight || 480;
                            canvas.width = w; canvas.height = h; ctx.drawImage(video,0,0,w,h);
                            const img = ctx.getImageData(0,0,w,h);
                            const code = jsQR(img.data, w, h, { inversionAttempts: 'attemptBoth' });
                            if (code && code.data) return onQrDecoded(code.data);
                        }
                    }

                scanLoopId = requestAnimationFrame(loop);
            };
            scanLoopId = requestAnimationFrame(loop);
        }

            if (hide) closeQrModal();

        async function onQrDecoded(decodedText) {
            if (!decodedText) return;

        }
        function normalizeSecret(s) { return String(s || '').replace(/\s+/g,'').replace(/=/g,'').toUpperCase(); }
        function parseOtpAuthUri(uri) {
            try {
                let secret = '', finalName = '', detail = '';
                if (/^otpauth:\/\//i.test(uri)) {
                    const url = new URL(uri);
                    if (url.protocol !== 'otpauth:') throw new Error('not otpauth');

                    if (!secret) return showToast('Mã QR không chứa Secret Key!');

                    const label = decodeURIComponent((url.pathname || '').replace(/^\/+/, '')).trim();

                        const parts = label.split(':');

                    return showToast('Mã QR không hợp lệ hoặc không phải mã 2FA.');

        function fillInputs(acc) { acc=acc||{}; accountName.value=acc.name||''; secretInput.value=acc.secret||''; detail1.value=acc.detail1||''; detail2.value=acc.detail2||''; }
        function clearAllInputs() { accountSelect.value=''; accountName.value=''; secretInput.value=''; detail1.value=''; detail2.value=''; clearBtn.style.display='none'; deleteBtn.style.display='none'; saveBtn.innerText='💾 Lưu'; updateUI(); }

        let toastTimeout; function showToast(message) { toast.innerText = message; toast.style.opacity = '1'; clearTimeout(toastTimeout); toastTimeout = setTimeout(()=>toast.style.opacity='0', 2600); }

        function base32ToUint8Array(base32) {
            const alphabet='ABCDEFGHIJKLMNOPQRSTUVWXYZ234567'; let bits=''; const cleaned=normalizeSecret(base32).replace(/[^A-Z2-7]/g,'');
            const value=new Uint8Array(Math.floor(cleaned.length*5/8)); let index=0;
            for (let i=0;i<cleaned.length;i++) { const val=alphabet.indexOf(cleaned[i]); if (val < 0) continue; bits += val.toString(2).padStart(5,'0'); }

        async function generateTOTP(secretBase32) {
            try { if (!secretBase32) return null; const keyBytes=base32ToUint8Array(secretBase32); if (!keyBytes.length) throw new Error('Invalid key');

                const cryptoKey=await crypto.subtle.importKey('raw', keyBytes, {name:'HMAC', hash:'SHA-1'}, false, ['sign']);
                const sig=await crypto.subtle.sign('HMAC', cryptoKey, counterBytes); const h=new Uint8Array(sig); const offset=h[h.length-1]&0xf;
                const binary=((h[offset]&0x7f)<<24)|((h[offset+1]&0xff)<<16)|((h[offset+2]&0xff)<<8)|(h[offset+3]&0xff);
                return String(binary % 1000000).padStart(6,'0');
            } catch(e) { return false; }
        }
        async function updateUI() {
            const secret=secretInput.value.trim(); const epoch=Math.floor(Date.now()/1000); const remaining=30-(epoch%30);
            timerText.innerText=remaining; progressBar.style.width=(remaining/30*100)+'%';
            if (remaining <= 5) { progressBar.style.backgroundColor='var(--danger)'; codeDisplay.style.color='var(--danger)'; } else { progressBar.style.backgroundColor='var(--primary)'; codeDisplay.style.color='var(--primary)'; }
            if (secret) { const otp=await generateTOTP(secret); if (otp===false) { errorMsg.style.display='block'; codeDisplay.innerText='------'; } else { errorMsg.style.display='none'; codeDisplay.innerText=otp.substring(0,3)+' '+otp.substring(3,6); } }
            else { errorMsg.style.display='none'; codeDisplay.innerText='------'; }
        }
        renderDropdown(); if (FIXED_ACCOUNTS.length) { accountSelect.value='fixed_0'; accountSelect.dispatchEvent(new Event('change')); } else if (customAccounts.length) { accountSelect.value='custom_0'; accountSelect.dispatchEvent(new Event('change')); }
        setInterval(updateUI, 1000);
    </script>
