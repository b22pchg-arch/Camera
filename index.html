<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giám Sát Hiện Trường - PC Tuyên Quang</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1a1d20">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <style>
        body { background-color: #1a1d20; color: #e9ecef; font-family: system-ui, -apple-system, sans-serif; }
        .nav-tabs .nav-link { color: #adb5bd; border: none; font-weight: bold; font-size: 13px; padding: 10px 5px; }
        .nav-tabs .nav-link.active { background-color: #212529; color: #0dcaf0; border-bottom: 3px solid #0dcaf0; }
        
        #camera-wrapper { background: #000; border-radius: 12px; overflow: hidden; max-width: 640px; margin: 0 auto; border: 1px solid #495057; }
        #camera-container { position: relative; aspect-ratio: 4/3; width: 100%; }
        #video-preview { width: 100%; height: 100%; object-fit: cover; }
        
        .preview-box { background: #111; border: 2px dashed #495057; border-radius: 8px; aspect-ratio: 4/3; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
        .preview-box img { width: 100%; height: 100%; object-fit: contain; }
        
        .photo-card { background: #2b3035; border: 1px solid #495057; border-radius: 8px; overflow: hidden; position: relative; transition: transform 0.2s; }
        .photo-card img { width: 100%; aspect-ratio: 3/4; object-fit: contain; background: #111; border-bottom: 1px solid #343a40; }
        .photo-card.stitched img { aspect-ratio: 16/9; object-fit: contain; background: #111; }
        
        .photo-radio, .photo-checkbox { position: absolute; top: 10px; left: 10px; width: 22px; height: 22px; z-index: 10; cursor: pointer; }
        
        .alert-dot { display: inline-block; width: 8px; height: 8px; background-color: #dc3545; border-radius: 50%; margin-left: 4px; animation: blink 1.2s infinite; }
        @keyframes blink { 0% { opacity: 0.2; } 50% { opacity: 1; } 100% { opacity: 0.2; } }
        
        .section-title { font-size: 14px; font-weight: bold; color: #6c757d; border-bottom: 1px solid #343a40; padding-bottom: 5px; margin-bottom: 10px; text-transform: uppercase; }
        .empty-box { background: #212529; border: 2px dashed #495057; border-radius: 8px; padding: 20px; text-align: center; color: #6c757d; font-size: 14px; }

        .scrollable-box { max-height: 55vh; overflow-y: auto; overflow-x: hidden; padding-right: 5px; }
        .scrollable-box::-webkit-scrollbar { width: 6px; }
        .scrollable-box::-webkit-scrollbar-track { background: #212529; border-radius: 4px; }
        .scrollable-box::-webkit-scrollbar-thumb { background: #495057; border-radius: 4px; }
        .scrollable-box::-webkit-scrollbar-thumb:hover { background: #0dcaf0; }

        .storage-alarm { animation: pulse-red 1.5s infinite; color: #fff !important; border: none !important; }
        .cursor-pointer { cursor: pointer; }
    </style>
</head>
<body>

<div class="container-fluid p-2" style="max-width: 800px; margin: 0 auto;">
    <!-- Header -->
    <div class="d-flex align-items-center justify-content-between border-bottom border-secondary pb-2 mb-3 mt-2">
        <h5 class="text-info m-0 fw-bold"><i class="fa-solid fa-bolt me-2"></i>GIÁM SÁT HIỆN TRƯỜNG</h5>
        <div class="d-flex align-items-center">
            <span class="badge bg-dark text-info border border-info px-2 py-1 small">PC TQ</span>
            <span id="storage-status" class="badge bg-dark text-secondary border border-secondary px-2 py-1 small ms-1">Dung lượng: --</span>
        </div>
    </div>

    <!-- Navigation Tabs -->
    <ul class="nav nav-tabs mb-3 border-secondary" id="mainTabs" role="tablist">
        <li class="nav-item flex-fill text-center" role="presentation">
            <button class="nav-link active w-100" id="capture-tab" data-bs-toggle="tab" data-bs-target="#capture-content" type="button" role="tab">
                <i class="fa-solid fa-camera mb-1 d-block"></i> Máy Ảnh
            </button>
        </li>
        <li class="nav-item flex-fill text-center" role="presentation">
            <button class="nav-link w-100" id="pending-tab" data-bs-toggle="tab" data-bs-target="#pending-content" type="button" role="tab" onclick="renderPending()">
                <i class="fa-solid fa-layer-group mb-1 d-block"></i> Chờ Ghép 
                <span id="pending-count" class="badge bg-secondary ms-1">0</span>
            </button>
        </li>
        <li class="nav-item flex-fill text-center" role="presentation">
            <button class="nav-link w-100" id="gallery-tab" data-bs-toggle="tab" data-bs-target="#gallery-content" type="button" role="tab" onclick="renderGallery()">
                <i class="fa-solid fa-images mb-1 d-block"></i> Đã Ghép 
                <span id="gallery-count" class="badge bg-secondary ms-1">0</span>
                <span id="gallery-alert" class="alert-dot" style="display:none;"></span>
            </button>
        </li>
    </ul>

    <!-- Tab Contents -->
    <div class="tab-content" id="mainTabsContent">
        
        <!-- TAB 1: MÁY ẢNH & GHÉP NHANH -->
        <div class="tab-pane fade show active" id="capture-content" role="tabpanel">
            
            <div class="card bg-dark border-secondary p-2 mb-3 shadow-sm">
                <label class="form-label text-info fw-bold small mb-2"><i class="fa-solid fa-layer-group me-1"></i> CHÂN TRANG TỰ ĐỘNG TÍCH HỢP:</label>
                <div class="row g-2">
                    <div class="col-4">
                        <div class="border border-secondary rounded p-1 text-center bg-black position-relative">
                            <span class="small text-warning d-block mb-1" style="font-size:10px; font-weight:bold;">NGƯỜI CHỤP</span>
                            <img id="img-selfie" src="" class="w-100 d-none" style="aspect-ratio: 1; object-fit: cover; border-radius: 4px;">
                            <div class="btn-group w-100" id="btn-grp-selfie">
                                <button class="btn btn-sm btn-outline-warning p-1" onclick="captureExtra('selfie')"><i class="fa-solid fa-camera"></i></button>
                                <label class="btn btn-sm btn-outline-info p-1 m-0"><i class="fa-solid fa-upload"></i><input type="file" hidden accept="image/*" onchange="uploadExtra(event, 'selfie')"></label>
                            </div>
                            <button id="clear-selfie" class="btn btn-sm btn-danger position-absolute top-0 start-100 translate-middle rounded-circle p-0 d-none" style="width: 20px; height: 20px; font-size: 10px;" onclick="clearExtra('selfie')"><i class="fa-solid fa-xmark"></i></button>
                        </div>
                    </div>
                    <div class="col-4">
                        <div class="border border-secondary rounded p-1 text-center bg-black position-relative">
                            <span class="small text-success d-block mb-1" style="font-size:10px; font-weight:bold;">BẢN ĐỒ</span>
                            <canvas id="canvas-map" class="w-100 bg-secondary" width="200" height="200" style="aspect-ratio: 1; border-radius: 4px;"></canvas>
                            <img id="img-map" src="" class="w-100 d-none" style="aspect-ratio: 1; object-fit: cover; border-radius: 4px;">
                            <label class="btn btn-sm btn-outline-info w-100 mt-1 p-0" style="font-size:10px;"><i class="fa-solid fa-upload me-1"></i> Tải đè<input type="file" hidden accept="image/*" onchange="uploadExtra(event, 'map')"></label>
                        </div>
                    </div>
                    <div class="col-4">
                        <div class="border border-secondary rounded p-1 text-center bg-black position-relative">
                            <span class="small text-danger d-block mb-1" style="font-size:10px; font-weight:bold;">LA BÀN</span>
                            <canvas id="canvas-compass" class="w-100 bg-dark" width="200" height="200" style="aspect-ratio: 1; border-radius: 4px; border: 1px solid #495057;"></canvas>
                            <img id="img-compass" src="" class="w-100 d-none" style="aspect-ratio: 1; object-fit: cover; border-radius: 4px;">
                            <label class="btn btn-sm btn-outline-info w-100 mt-1 p-0" style="font-size:10px;"><i class="fa-solid fa-upload me-1"></i> Tải đè<input type="file" hidden accept="image/*" onchange="uploadExtra(event, 'compass')"></label>
                        </div>
                    </div>
                </div>
            </div>
            <div class="d-flex justify-content-between align-items-center mb-2 gap-2">
                <button class="btn btn-sm btn-outline-secondary text-white text-nowrap" onclick="toggleCamera()">
                    <i class="fa-solid fa-camera-rotate"></i>
                </button>
                <input type="text" id="tab1-team" class="form-control form-control-sm bg-secondary text-white border-secondary text-center" placeholder="Tổ đội / Người thực hiện...">
                <span id="gps-status" class="badge bg-dark bg-opacity-75 text-warning border border-warning small text-nowrap" style="font-size: 10px;">
                    <i class="fa-solid fa-location-crosshairs fa-spin me-1"></i> GPS...
                </span>
            </div>

            <div id="camera-wrapper" class="shadow mb-3">
                <div id="camera-container">
                    <video id="video-preview" autoplay playsinline muted></video>
                </div>
                <div id="zoom-control-container" style="display: none; padding: 12px 15px; background: #212529; border-top: 1px solid #343a40;">
                    <div class="d-flex justify-content-between align-items-center mb-1">
                        <span class="small text-info fw-bold"><i class="fa-solid fa-magnifying-glass me-1"></i> THU PHÓNG</span>
                        <span id="zoom-value-display" class="badge bg-secondary text-info fw-bold">1.0x</span>
                    </div>
                    <input type="range" id="camera-zoom-slider" class="form-range" style="accent-color: #0dcaf0;">
                </div>
            </div>

            <!-- BỘ ẢNH PHỤ TRỢ MỚI TỰ ĐỘNG -->
            

            <div class="row g-2 mb-3">
                <div class="col-6">
                    <button class="btn btn-primary w-100 py-3 fw-bold shadow" onclick="capturePhoto('TRƯỚC')">
                        <i class="fa-solid fa-circle-dot me-1"></i> Chụp "TRƯỚC"
                    </button>
                </div>
                <div class="col-6">
                    <button class="btn btn-success w-100 py-3 fw-bold shadow" onclick="capturePhoto('SAU')">
                        <i class="fa-solid fa-circle-dot me-1"></i> Chụp "SAU"
                    </button>
                </div>
            </div>

            <!-- Preview ẢNH VỪA CHỤP -->
            <div class="row g-2 mb-3">
                <div class="col-6">
                    <div id="preview-before" class="preview-box"><span class="text-muted small">Ảnh TRƯỚC</span></div>
                </div>
                <div class="col-6">
                    <div id="preview-after" class="preview-box"><span class="text-muted small">Ảnh SAU</span></div>
                </div>
            </div>

            <div class="card bg-dark border-secondary p-3 mb-3 shadow-sm">
                

                <label class="form-label text-info fw-bold small mb-1">TÊN HOẶC MÃ HIỆN TRƯỜNG:</label>
                <div class="input-group input-group-sm mb-2">
                    <input type="text" id="tab1-prefix" class="form-control bg-secondary text-white border-secondary" placeholder="TBA_Gia_Tran_01">
                </div>
                
                <label class="form-label text-warning fw-bold small mb-1">GHI CHÚ (Hiển thị chân ảnh ghép):</label>
                <div class="input-group input-group-sm mb-3">
                    <input type="text" id="tab1-note" class="form-control bg-secondary text-white border-secondary" placeholder="Thay sứ, vuốt lại lèo...">
                </div>

                <button id="btn-stitch-fast" class="btn btn-info w-100 fw-bold py-2 text-dark" disabled onclick="quickStitch()">
                    GHÉP NGAY & LƯU KHO
                </button>
            </div>
        </div>

        <!-- TAB 2: KHO PHỤ & GHÉP ẢNH -->
        <div class="tab-pane fade" id="pending-content" role="tabpanel">
            <div class="card bg-dark border-secondary p-3 mb-3 shadow-sm">
                <label class="form-label text-info fw-bold small mb-1">TỔ ĐỘI / NGƯỜI THỰC HIỆN (Tùy chọn):</label>
                <div class="input-group input-group-sm mb-2">
                    <input type="text" id="tab2-team" class="form-control bg-secondary text-white border-secondary" placeholder="Đội xung kích, Đội QLVH...">
                </div>

                <label class="form-label text-info fw-bold small mb-1">TÊN HOẶC MÃ HIỆN TRƯỜNG:</label>
                <div class="input-group input-group-sm mb-2">
                    <input type="text" id="tab2-prefix" class="form-control bg-secondary text-white border-secondary" placeholder="TBA_Gia_Tran_01">
                </div>
                
                <label class="form-label text-warning fw-bold small mb-1">GHI CHÚ DÙNG CHUNG (Cho ghép thủ công):</label>
                <div class="input-group input-group-sm mb-3">
                    <input type="text" id="tab2-note" class="form-control bg-secondary text-white border-secondary" placeholder="Thay sứ, vuốt lại lèo...">
                </div>

                <div class="row g-2">
                    <div class="col-6">
                        <button class="btn btn-outline-info w-100 fw-bold py-2" onclick="manualStitch()">GHÉP MỤC ĐÃ CHỌN</button>
                    </div>
                    <div class="col-6">
                        <button class="btn btn-info text-dark w-100 fw-bold py-2 shadow" onclick="autoStitch()">
                            <i class="fa-solid fa-wand-magic-sparkles me-1"></i> GHÉP TỰ ĐỘNG
                        </button>
                    </div>
                </div>
            </div>

            <div class="row g-2">
                <div class="col-6">
                    <div class="d-flex justify-content-between align-items-center border-bottom border-secondary pb-1 mb-2">
                        <span class="section-title text-primary m-0 border-0"><i class="fa-solid fa-box-open me-1"></i> Kho "Trước"</span>
                        <label class="btn btn-sm btn-outline-primary p-1 px-2 m-0 cursor-pointer" style="font-size:11px;">
                            <i class="fa-solid fa-upload"></i> Tải ảnh
                            <input type="file" class="d-none" accept="image/*" multiple onchange="handleFileUpload(event, 'TRƯỚC')">
                        </label>
                    </div>
                    <div id="list-before" class="scrollable-box"></div>
                </div>
                <div class="col-6">
                    <div class="d-flex justify-content-between align-items-center border-bottom border-secondary pb-1 mb-2">
                        <span class="section-title text-success m-0 border-0"><i class="fa-solid fa-box-open me-1"></i> Kho "Sau"</span>
                        <label class="btn btn-sm btn-outline-success p-1 px-2 m-0 cursor-pointer" style="font-size:11px;">
                            <i class="fa-solid fa-upload"></i> Tải ảnh
                            <input type="file" class="d-none" accept="image/*" multiple onchange="handleFileUpload(event, 'SAU')">
                        </label>
                    </div>
                    <div id="list-after" class="scrollable-box"></div>
                </div>
            </div>
        </div>

        <!-- TAB 3: KHO ẢNH HOÀN THIỆN -->
        <div class="tab-pane fade" id="gallery-content" role="tabpanel">
            <div class="card bg-dark border-secondary p-3 mb-3 shadow-sm">
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <div class="form-check m-0">
                        <input class="form-check-input" type="checkbox" id="select-all-checkbox" onchange="toggleSelectAll(this)">
                        <label class="form-check-label small fw-bold text-light" for="select-all-checkbox">Chọn tất cả</label>
                    </div>
                    <div class="d-flex align-items-center gap-2">
                        <span class="small text-secondary" id="selected-counter">Đã chọn: 0</span>
                        <label class="btn btn-sm btn-outline-secondary py-0 px-2 m-0 cursor-pointer" style="font-size:11px;">
                            <i class="fa-solid fa-plus"></i> Thêm ngoài
                            <input type="file" class="d-none" accept="image/*" multiple onchange="handleFileUpload(event, 'STITCHED')">
                        </label>
                    </div>
                </div>
                <div class="row g-2">
                    <div class="col-6">
                        <button class="btn btn-sm btn-outline-danger w-100 fw-bold" onclick="deleteSelectedPhotos()">XÓA ĐÃ CHỌN</button>
                    </div>
                    <div class="col-6">
                        <button class="btn btn-sm btn-info text-dark w-100 fw-bold shadow" onclick="shareSelectedPhotos()">CHIA SẺ / TẢI VỀ</button>
                    </div>
                </div>
            </div>
            <div id="gallery-grid" class="row g-3 scrollable-box"></div>
            <div id="gallery-empty-msg" class="empty-box d-none">
                <i class="fa-solid fa-folder-open display-1 mb-2 d-block"></i>Kho ảnh hoàn thiện đang trống.
            </div>
        </div>

    </div>
</div>

<div class="modal fade" id="autoStitchModal" tabindex="-1" aria-hidden="true" data-bs-backdrop="static">
  <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
    <div class="modal-content bg-dark text-light border-secondary">
      <div class="modal-header border-secondary">
        <h5 class="modal-title text-info"><i class="fa-solid fa-wand-magic-sparkles me-2"></i>Duyệt Ghép Tự Động</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body" id="autoStitchModalBody"></div>
      <div class="modal-footer border-secondary">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
        <button type="button" class="btn btn-info fw-bold" onclick="confirmAutoStitch()">Tiến Hành Ghép</button>
      </div>
    </div>
  </div>
</div>

<script>
    let localStream = null;
    let currentFacingMode = "environment";
    let currentGpsData = { lat: 0, lng: 0, accuracy: "N/A", text: "0.000000, 0.000000" };
    let db = null;
    let currentHeading = 0;
    
    let repoBefore = [];
    let repoAfter = [];
    let repoStitched = [];

    let captureBuffer = { TRƯỚC: null, SAU: null };
    let windowAutoMatches = [];
    let currentStoragePercent = 0;
    
    let globalExtras = { selfie: null, map: null, compass: null };

    const dbRequest = indexedDB.open("AirGapCameraV17", 1);
    dbRequest.onupgradeneeded = (e) => {
        let database = e.target.result;
        if (!database.objectStoreNames.contains("photos")) {
            database.createObjectStore("photos", { keyPath: "id" });
        }
    };
    dbRequest.onsuccess = (e) => {
        db = e.target.result;
        loadDataFromDB();
    };

    document.addEventListener("DOMContentLoaded", () => {
        initCamera();
        initGpsTracking();
        initCompassListener();
        
        window.addEventListener('beforeunload', (e) => {
            if (repoStitched.length > 0 || repoBefore.length > 0 || repoAfter.length > 0) {
                e.preventDefault(); e.returnValue = 'Dữ liệu chưa tải về!'; return e.returnValue;
            }
        });

        document.getElementById('tab1-prefix').addEventListener('input', (e) => document.getElementById('tab2-prefix').value = e.target.value);
        document.getElementById('tab2-prefix').addEventListener('input', (e) => document.getElementById('tab1-prefix').value = e.target.value);
        document.getElementById('tab1-team').addEventListener('input', (e) => document.getElementById('tab2-team').value = e.target.value);
        document.getElementById('tab2-team').addEventListener('input', (e) => document.getElementById('tab1-team').value = e.target.value);
        document.getElementById('tab1-note').addEventListener('input', (e) => document.getElementById('tab2-note').value = e.target.value);
        document.getElementById('tab2-note').addEventListener('input', (e) => document.getElementById('tab1-note').value = e.target.value);
        
        setInterval(drawCompassCanvas, 200); // Update compass drawing
    });

    async function calculateStorageQuota() {
        if (navigator.storage && navigator.storage.estimate) {
            try {
                const estimate = await navigator.storage.estimate();
                const usedMB = (estimate.usage / (1024 * 1024)).toFixed(1);
                const totalQuotaMB = (estimate.quota / (1024 * 1024)).toFixed(0);
                currentStoragePercent = parseFloat(((estimate.usage / estimate.quota) * 100).toFixed(1));

                const statusBadge = document.getElementById("storage-status");
                if (statusBadge) {
                    statusBadge.innerText = `Bộ nhớ: ${usedMB}MB / ${totalQuotaMB}MB (${currentStoragePercent}%)`;
                    if (currentStoragePercent > 85) statusBadge.className = "badge storage-alarm px-2 py-1 small ms-1";
                    else if (currentStoragePercent > 60) statusBadge.className = "badge bg-warning text-dark px-2 py-1 small ms-1";
                    else statusBadge.className = "badge bg-dark text-info border border-info px-2 py-1 small ms-1";
                }
            } catch (err) { console.error("Lỗi Quota:", err); }
        }
    }

    function toggleCamera() {
        currentFacingMode = currentFacingMode === "environment" ? "user" : "environment";
        initCamera();
    }

    function initCamera() {
        if (localStream) { localStream.getTracks().forEach(track => track.stop()); }
        if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
            navigator.mediaDevices.getUserMedia({
                video: { facingMode: currentFacingMode, width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false
            })
            .then(stream => {
                localStream = stream;
                document.getElementById("video-preview").srcObject = stream;
                document.getElementById("video-preview").onloadedmetadata = () => initCameraZoom(stream);
            }).catch(err => alert("Không thể mở camera. Vui lòng cấp quyền!"));
        }
    }

    function initCameraZoom(stream) {
        const track = stream.getVideoTracks()[0];
        const capabilities = track.getCapabilities();
        const settings = track.getSettings();
        if ('zoom' in capabilities) {
            document.getElementById('zoom-control-container').style.display = 'block';
            const slider = document.getElementById('camera-zoom-slider');
            const display = document.getElementById('zoom-value-display');
            slider.min = capabilities.zoom.min; slider.max = capabilities.zoom.max;
            slider.step = capabilities.zoom.step || 0.1; slider.value = settings.zoom || capabilities.zoom.min;
            if (display) display.innerText = parseFloat(slider.value).toFixed(1) + "x";
            
            slider.oninput = (e) => {
                const val = parseFloat(e.target.value);
                if (display) display.innerText = val.toFixed(1) + "x";
                track.applyConstraints({ advanced: [{ zoom: val }] }).catch(() => {});
            };
        } else {
            document.getElementById('zoom-control-container').style.display = 'none';
        }
    }

    function initGpsTracking() {
        if ("geolocation" in navigator) {
            navigator.geolocation.watchPosition(
                (pos) => {
                    currentGpsData.lat = pos.coords.latitude;
                    currentGpsData.lng = pos.coords.longitude;
                    currentGpsData.text = `${pos.coords.latitude.toFixed(6)}, ${pos.coords.longitude.toFixed(6)}`;
                    document.getElementById("gps-status").className = "badge bg-dark bg-opacity-75 text-info border border-info small";
                    document.getElementById("gps-status").innerHTML = `<i class="fa-solid fa-location-dot text-success me-1"></i> ${currentGpsData.text}`;
                    if(!globalExtras.map) updateMapCanvas(); // Auto update map if not manually overridden
                }, null, { enableHighAccuracy: true, timeout: 10000 }
            );
        }
    }

    function initCompassListener() {
        window.addEventListener('deviceorientationabsolute', handleOrientation, true);
        window.addEventListener('deviceorientation', handleOrientation, true);
    }

    function handleOrientation(event) {
        let alpha = event.alpha;
        let webkitAlpha = event.webkitCompassHeading;
        if (webkitAlpha !== undefined) {
            currentHeading = webkitAlpha;
        } else if (alpha !== null) {
            currentHeading = Math.abs(alpha - 360);
        }
    }

    function drawCompassCanvas() {
        if(globalExtras.compass) return; // overridden
        const c = document.getElementById('canvas-compass');
        const ctx = c.getContext('2d');
        const cx = c.width / 2; const cy = c.height / 2; const r = cx - 10;
        
        ctx.clearRect(0, 0, c.width, c.height);
        
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(-currentHeading * Math.PI / 180);
        
        // Vòng la bàn
        ctx.beginPath(); ctx.arc(0, 0, r, 0, 2 * Math.PI);
        ctx.strokeStyle = "#0dcaf0"; ctx.lineWidth = 4; ctx.stroke();
        
        // Kim la bàn (Đỏ chỉ Bắc)
        ctx.beginPath(); ctx.moveTo(0, -r + 10); ctx.lineTo(10, 0); ctx.lineTo(-10, 0); ctx.fillStyle = "#dc3545"; ctx.fill();
        // Nửa Nam
        ctx.beginPath(); ctx.moveTo(0, r - 10); ctx.lineTo(10, 0); ctx.lineTo(-10, 0); ctx.fillStyle = "#ffffff"; ctx.fill();
        
        ctx.fillStyle = "#ffffff"; ctx.font = "bold 20px Arial"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillText("N", 0, -r - 15); ctx.fillText("S", 0, r + 15);
        ctx.fillText("E", r + 15, 0); ctx.fillText("W", -r - 15, 0);
        ctx.restore();
        
        // Độ số ở giữa
        ctx.fillStyle = "#ffc107"; ctx.font = "bold 24px Arial"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillText(`${Math.round(currentHeading)}°`, cx, cy);
    }

    function updateMapCanvas() {
        const c = document.getElementById('canvas-map');
        const ctx = c.getContext('2d');
        const zoom = 16;
        const latRad = currentGpsData.lat * Math.PI / 180;
        const n = Math.pow(2, zoom);
        const xtile = Math.floor((currentGpsData.lng + 180.0) / 360.0 * n);
        const ytile = Math.floor((1.0 - Math.log(Math.tan(latRad) + 1 / Math.cos(latRad)) / Math.PI) / 2.0 * n);

        const img = new Image();
        img.crossOrigin = "Anonymous"; // Required for Canvas toDataUrl later
        img.src = `https://a.tile.openstreetmap.org/${zoom}/${xtile}/${ytile}.png`;
        
        img.onload = () => {
            ctx.drawImage(img, 0, 0, c.width, c.height);
            // Draw Pin
            ctx.fillStyle = "rgba(220, 53, 69, 0.4)";
            ctx.beginPath(); ctx.arc(c.width/2, c.height/2, 20, 0, 2*Math.PI); ctx.fill();
            ctx.fillStyle = "#dc3545";
            ctx.beginPath(); ctx.arc(c.width/2, c.height/2, 8, 0, 2*Math.PI); ctx.fill();
            ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; ctx.stroke();
        };
        img.onerror = () => {
            // Fallback offline map graphic
            ctx.fillStyle = "#2b3035"; ctx.fillRect(0, 0, c.width, c.height);
            ctx.strokeStyle = "#495057"; ctx.lineWidth = 1;
            for(let i=0; i<c.width; i+=20) { ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,c.height); ctx.stroke(); }
            for(let i=0; i<c.height; i+=20) { ctx.beginPath(); ctx.moveTo(0,i); ctx.lineTo(c.width,i); ctx.stroke(); }
            ctx.fillStyle = "#dc3545";
            ctx.beginPath(); ctx.arc(c.width/2, c.height/2, 10, 0, 2*Math.PI); ctx.fill();
        };
    }

    function captureExtra(key) {
        const video = document.getElementById("video-preview");
        if (!localStream || !video.videoWidth) return alert("Camera chưa sẵn sàng!");
        
        const canvas = document.createElement("canvas");
        let size = Math.min(video.videoWidth, video.videoHeight);
        canvas.width = 640; canvas.height = 640;
        const ctx = canvas.getContext("2d");
        
        if (currentFacingMode === "user") {
            ctx.translate(canvas.width, 0); ctx.scale(-1, 1);
        }
        
        let sx = (video.videoWidth - size) / 2;
        let sy = (video.videoHeight - size) / 2;
        ctx.drawImage(video, sx, sy, size, size, 0, 0, 640, 640);
        
        let dataUrl = canvas.toDataURL("image/jpeg", 0.85);
        globalExtras[key] = dataUrl;
        
        document.getElementById(`img-${key}`).src = dataUrl;
        document.getElementById(`img-${key}`).classList.remove('d-none');
        document.getElementById(`btn-grp-${key}`).classList.add('d-none');
        document.getElementById(`clear-${key}`).classList.remove('d-none');
        if(key==='map') document.getElementById('canvas-map').classList.add('d-none');
        if(key==='compass') document.getElementById('canvas-compass').classList.add('d-none');
        
        document.body.style.opacity = 0.5;
        setTimeout(() => document.body.style.opacity = 1, 100);
    }

    function uploadExtra(event, key) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
            const img = new Image();
            img.onload = () => {
                const canvas = document.createElement("canvas");
                let size = Math.min(img.width, img.height);
                canvas.width = 640; canvas.height = 640;
                const ctx = canvas.getContext("2d");
                
                let sx = (img.width - size) / 2;
                let sy = (img.height - size) / 2;
                ctx.drawImage(img, sx, sy, size, size, 0, 0, 640, 640);
                
                let dataUrl = canvas.toDataURL("image/jpeg", 0.85);
                globalExtras[key] = dataUrl;
                
                document.getElementById(`img-${key}`).src = dataUrl;
                document.getElementById(`img-${key}`).classList.remove('d-none');
                
                if(key==='selfie') {
                    document.getElementById(`btn-grp-${key}`).classList.add('d-none');
                    document.getElementById(`clear-${key}`).classList.remove('d-none');
                } else {
                    document.getElementById(`canvas-${key}`).classList.add('d-none');
                }
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
        event.target.value = "";
    }

    function clearExtra(key) {
        globalExtras[key] = null;
        document.getElementById(`img-${key}`).src = "";
        document.getElementById(`img-${key}`).classList.add('d-none');
        document.getElementById(`btn-grp-${key}`).classList.remove('d-none');
        document.getElementById(`clear-${key}`).classList.add('d-none');
    }

    // 🌟 LÕI CHỤP ẢNH MỚI: TẠO CHÂN TRANG NGAY KHI CHỤP TỪNG ẢNH TRƯỚC/SAU
            async function capturePhoto(type) {
        if (currentStoragePercent > 95) return alert(`⚠️ Bộ nhớ đầy (${currentStoragePercent}%)!`);
        if (currentStoragePercent > 80 && !confirm(`⚠️ Bộ nhớ sắp đầy (${currentStoragePercent}%)! Tiếp tục?`)) return;

        const video = document.getElementById("video-preview");
        if (!localStream || !video.videoWidth) return alert("Camera chưa sẵn sàng!");
        
        const canvas = document.createElement("canvas");
        const ctx = canvas.getContext("2d");
        
        const scale = video.videoWidth / 1000;
        
        // Tính toán kích thước footer
        const imgBoxSize = Math.min(280 * scale, video.videoWidth * 0.18);
        const footerH = imgBoxSize + 40 * scale; 
        
        canvas.width = video.videoWidth; 
        canvas.height = video.videoHeight + footerH; 
        
        // 1. Vẽ video gốc
        ctx.save();
        if (currentFacingMode === "user") {
            ctx.translate(canvas.width, 0); ctx.scale(-1, 1);
        }
        ctx.drawImage(video, 0, 0, canvas.width, video.videoHeight);
        ctx.restore();

        // 2. Vẽ nền Chân trang (Footer)
        const fY = video.videoHeight;
        ctx.fillStyle = "#111111";
        ctx.fillRect(0, fY, canvas.width, footerH);
        ctx.strokeStyle = "#343a40";
        ctx.lineWidth = 4 * scale;
        ctx.strokeRect(0, fY, canvas.width, footerH);

        // 3. Chuẩn bị Văn bản
        const now = new Date();
        const timeStr = `${now.toLocaleTimeString("vi-VN", { hour: '2-digit', minute: '2-digit', second: '2-digit' })} - ${now.toLocaleDateString("vi-VN")}`;
        const teamText = document.getElementById("tab1-team").value.trim();
        
        // 4. Tính toán tọa độ X cho các phần tử theo yêu cầu V16
        const pad = 20 * scale;
        let maxTextW = canvas.width - (3 * imgBoxSize) - (5 * pad); 
        if (maxTextW < 100) maxTextW = 100;
        
        let textX, selfieX, mapX, compassX;
        if (type === "TRƯỚC") {
            textX = pad;
            selfieX = textX + maxTextW + pad;
            mapX = selfieX + imgBoxSize + pad;
            compassX = mapX + imgBoxSize + pad;
        } else {
            compassX = pad;
            mapX = compassX + imgBoxSize + pad;
            selfieX = mapX + imgBoxSize + pad;
            textX = canvas.width - pad;
        }

        const drawExtraSync = (sourceDataUrl, canvasSourceId, labelText, xPos) => {
            return new Promise((resolve) => {
                let sourceToDraw = sourceDataUrl;
                if (!sourceToDraw && canvasSourceId) {
                    let c = document.getElementById(canvasSourceId);
                    if (c && !c.classList.contains('d-none')) {
                        try { sourceToDraw = c.toDataURL("image/jpeg", 0.9); } catch(e) {}
                    }
                }
                
                if (!sourceToDraw) { resolve(); return; }
                
                let img = new Image();
                img.onload = () => {
                    ctx.fillStyle = "#000";
                    ctx.fillRect(xPos, fY + 20 * scale, imgBoxSize, imgBoxSize);
                    ctx.drawImage(img, xPos, fY + 20 * scale, imgBoxSize, imgBoxSize);
                    
                    ctx.strokeStyle = "#495057";
                    ctx.lineWidth = 4 * scale;
                    ctx.strokeRect(xPos, fY + 20 * scale, imgBoxSize, imgBoxSize);
                    
                    let labelH = imgBoxSize * 0.18;
                    ctx.fillStyle = "rgba(0,0,0,0.7)";
                    ctx.fillRect(xPos, fY + 20 * scale + imgBoxSize - labelH, imgBoxSize, labelH);
                    
                    ctx.fillStyle = "#0dcaf0";
                    ctx.font = `bold ${labelH * 0.6}px Arial`;
                    ctx.textAlign = "center";
                    ctx.textBaseline = "middle";
                    ctx.fillText(labelText, xPos + imgBoxSize/2, fY + 20 * scale + imgBoxSize - labelH/2);
                    
                    resolve();
                };
                img.onerror = resolve;
                img.src = sourceToDraw;
            });
        };

        // Vẽ ĐỒNG BỘ: đợi load xong từng ảnh phụ trợ rồi mới đi tiếp
        await Promise.all([
            drawExtraSync(globalExtras.compass, 'canvas-compass', "LA BÀN", compassX),
            drawExtraSync(globalExtras.map, 'canvas-map', "BẢN ĐỒ", mapX),
            drawExtraSync(globalExtras.selfie, null, "NGƯỜI CHỤP", selfieX)
        ]);

        // 5. Vẽ Thông tin Văn bản
        let startY = fY + 40 * scale;
        let lineGap = (footerH - 60 * scale) / 3;
        
                ctx.textAlign = type === "TRƯỚC" ? "left" : "right";
        ctx.textBaseline = "middle";
        
        ctx.fillStyle = type === "TRƯỚC" ? "#0d6efd" : "#20c997";
        ctx.font = `bold ${lineGap * 0.7}px Arial`;
        ctx.fillText(`${type}`, textX, startY, maxTextW);
        
        ctx.fillStyle = "#ffffff";
        ctx.font = `bold ${lineGap * 0.55}px Arial`;
        ctx.fillText(`THỜI GIAN: ${timeStr}`, textX, startY + lineGap, maxTextW);
        ctx.fillText(`TỌA ĐỘ: ${currentGpsData.text}`, textX, startY + lineGap * 2, maxTextW);
        
        if (teamText) {
            ctx.fillStyle = "#ffc107";
            ctx.fillText(`TỔ ĐỘI: ${teamText}`, textX, startY + lineGap * 3, maxTextW);
        }

        // 6. LƯU ẢNH
        const photoObj = {
            id: "img_" + Date.now(),
            type: type,
            dataUrl: canvas.toDataURL("image/jpeg", 0.85),
            timestampMs: now.getTime()
        };

        if (type === "TRƯỚC") repoBefore.unshift(photoObj);
        else repoAfter.unshift(photoObj);
        saveToDB(photoObj);
        
        captureBuffer[type] = photoObj;
        document.getElementById(type === "TRƯỚC" ? "preview-before" : "preview-after").innerHTML = `<img src="${photoObj.dataUrl}">`;
        if (captureBuffer.TRƯỚC && captureBuffer.SAU) document.getElementById("btn-stitch-fast").removeAttribute("disabled");

        updateUIState();
        document.body.style.opacity = 0.5;
        setTimeout(() => document.body.style.opacity = 1, 100);
    }

    function handleFileUpload(event, type) {
        const files = event.target.files;
        if (!files.length) return;

        Array.from(files).forEach(file => {
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement("canvas");
                    let w = img.width; let h = img.height;
                    const maxDim = 1920;
                    if (w > maxDim || h > maxDim) {
                        const ratio = Math.min(maxDim/w, maxDim/h);
                        w = w * ratio; h = h * ratio;
                    }
                    canvas.width = w; canvas.height = h;
                    const ctx = canvas.getContext("2d");
                    ctx.drawImage(img, 0, 0, w, h);

                    const compressedDataUrl = canvas.toDataURL("image/jpeg", 0.85);
                    const photoObj = {
                        id: "uploaded_" + Date.now() + Math.floor(Math.random()*1000),
                        type: type,
                        dataUrl: compressedDataUrl,
                        timestampMs: Date.now(),
                        name: type === "STITCHED" ? file.name : undefined
                    };

                    if (type === "TRƯỚC") repoBefore.unshift(photoObj);
                    else if (type === "SAU") repoAfter.unshift(photoObj);
                    else repoStitched.push(photoObj);

                    saveToDB(photoObj); updateUIState(); renderPending();
                    if (type === "STITCHED") renderGallery();
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        });
        event.target.value = "";
    }

    function quickStitch() {
        if (!captureBuffer.TRƯỚC || !captureBuffer.SAU) return;
        processStitching(captureBuffer.TRƯỚC, captureBuffer.SAU, true, null, () => {
            captureBuffer = { TRƯỚC: null, SAU: null };
            document.getElementById("preview-before").innerHTML = '<span class="text-muted small">Ảnh TRƯỚC</span>';
            document.getElementById("preview-after").innerHTML = '<span class="text-muted small">Ảnh SAU</span>';
            document.getElementById("btn-stitch-fast").setAttribute("disabled", "true");
        });
    }

    function manualStitch() {
        const checkedBefore = document.querySelector('input[name="radioBefore"]:checked');
        const checkedAfter = document.querySelector('input[name="radioAfter"]:checked');
        if (!checkedBefore || !checkedAfter) return alert("Chọn 1 ảnh TRƯỚC và 1 ảnh SAU để ghép!");

        const bObj = repoBefore.find(x => x.id === checkedBefore.value);
        const aObj = repoAfter.find(x => x.id === checkedAfter.value);
        processStitching(bObj, aObj);
    }

    function autoStitch() {
        if (repoBefore.length === 0 || repoAfter.length === 0) return alert("Không đủ dữ liệu!");

        windowAutoMatches = [];
        let availableAfters = [...repoAfter];
        let sortedBefores = [...repoBefore].sort((a,b) => a.timestampMs - b.timestampMs);
        
        for (let b of sortedBefores) {
            if (availableAfters.length === 0) break;
            let closestA = availableAfters[0];
            let minDiff = Math.abs(b.timestampMs - closestA.timestampMs);
            let closestIdx = 0;
            
            for (let i = 1; i < availableAfters.length; i++) {
                let diff = Math.abs(b.timestampMs - availableAfters[i].timestampMs);
                if (diff < minDiff) { minDiff = diff; closestA = availableAfters[i]; closestIdx = i; }
            }
            windowAutoMatches.push({ before: b, after: closestA });
            availableAfters.splice(closestIdx, 1);
        }
        
        if (windowAutoMatches.length === 0) return alert("Lỗi cặp đối khớp!");

        let html = `<p class="small text-info mb-3">Tìm thấy <b>${windowAutoMatches.length}</b> cặp ảnh trùng khớp:</p>`;
        windowAutoMatches.forEach((m, idx) => {
            const timeB = new Date(m.before.timestampMs).toLocaleTimeString("vi-VN");
            const timeA = new Date(m.after.timestampMs).toLocaleTimeString("vi-VN");
            html += `
                <div class="card bg-secondary mb-3 p-2 border-0 shadow-sm">
                    <div class="d-flex justify-content-between small fw-bold mb-1">
                        <span class="text-warning"><i class="fa-solid fa-clock"></i> Trước: ${timeB}</span>
                        <span class="text-success"><i class="fa-solid fa-clock"></i> Sau: ${timeA}</span>
                    </div>
                    <div class="d-flex gap-1 mb-2">
                        <div style="flex: 1; aspect-ratio: 4/3; background: #111; border-radius: 4px; overflow: hidden;">
                            <img src="${m.before.dataUrl}" style="width: 100%; height: 100%; object-fit: contain;">
                        </div>
                        <div style="flex: 1; aspect-ratio: 4/3; background: #111; border-radius: 4px; overflow: hidden;">
                            <img src="${m.after.dataUrl}" style="width: 100%; height: 100%; object-fit: contain;">
                        </div>
                    </div>
                    <input type="text" id="auto-note-${idx}" class="form-control form-control-sm bg-dark text-white border-secondary" placeholder="Ghi chú cho cặp này (TỰ ĐỘNG IN HOA)...">
                </div>
            `;
        });
        document.getElementById('autoStitchModalBody').innerHTML = html;
        new bootstrap.Modal(document.getElementById('autoStitchModal')).show();
    }

    async function confirmAutoStitch() {
        const modalEl = document.getElementById('autoStitchModal');
        bootstrap.Modal.getInstance(modalEl).hide();

        let count = 0;
        for (let i = 0; i < windowAutoMatches.length; i++) {
            const match = windowAutoMatches[i];
            const customNote = document.getElementById('auto-note-' + i).value.trim();
            await processStitching(match.before, match.after, false, customNote, null);
            count++;
        }
        alert(`Tự động ghép thành công ${count} cặp ảnh!`);
        renderPending(); renderGallery();
    }

    // 🌟 LÕI GHÉP ẢNH TỐI ƯU: ĐẶT GHI CHÚ VÀO GIỮA 2 CHÂN TRANG
    function processStitching(bObj, aObj, showAlert = true, customNote = null, callback = null) {
        return new Promise((resolve) => {
            const stitchCanvas = document.createElement("canvas");
            const ctx = stitchCanvas.getContext("2d");

            const loadB = new Promise(res => { const i = new Image(); i.src = bObj.dataUrl; i.onload = () => res(i); });
            const loadA = new Promise(res => { const i = new Image(); i.src = aObj.dataUrl; i.onload = () => res(i); });

            Promise.all([loadB, loadA]).then(([loadedB, loadedA]) => {
                
                stitchCanvas.width = loadedB.width + loadedA.width; 
                stitchCanvas.height = Math.max(loadedB.height, loadedA.height);
                
                ctx.drawImage(loadedB, 0, 0, loadedB.width, loadedB.height);
                ctx.drawImage(loadedA, loadedB.width, 0, loadedA.width, loadedA.height);

                // Ghi chú Ghép nằm giữa khu vực Chân Trang của 2 ảnh
                let rawNote = (customNote !== null) ? customNote : document.getElementById("tab1-note").value.trim();
                let noteText = rawNote.toUpperCase();
                
                if (noteText) {
                    const imgScale = loadedB.width / 1000;
                    const noteSize = Math.round(45 * imgScale);
                    ctx.font = `bold ${noteSize}px Arial`;
                    
                    const noteWidth = ctx.measureText(noteText).width;
                    const paddingY = 40 * imgScale; const noteHeight = noteSize + paddingY;
                    
                    // Tự động tính toán chiều cao chân trang theo tỷ lệ ảnh
                    const singleImgBoxSize = Math.min(280 * imgScale, loadedB.width * 0.18);
                    const footerH = singleImgBoxSize + 40 * imgScale; 
                    
                    // Tâm là điểm cắt nhau giữa 4 khu vực: (X = loadedB.width, Y = stitchCanvas.height - footerH)
                    const noteX = loadedB.width; 
                    const noteY = stitchCanvas.height - footerH; 
                    
                    ctx.fillStyle = "rgba(0, 0, 0, 0.85)"; ctx.beginPath();
                    ctx.roundRect ? ctx.roundRect(noteX - noteWidth/2 - 40*imgScale, noteY - noteHeight/2, noteWidth + 80*imgScale, noteHeight, 15*imgScale) 
                                  : ctx.fillRect(noteX - noteWidth/2 - 40*imgScale, noteY - noteHeight/2, noteWidth + 80*imgScale, noteHeight);
                    ctx.fill();
                    
                    ctx.strokeStyle = "#0dcaf0"; ctx.lineWidth = 4 * imgScale;
                    ctx.roundRect ? ctx.roundRect(noteX - noteWidth/2 - 40*imgScale, noteY - noteHeight/2, noteWidth + 80*imgScale, noteHeight, 15*imgScale) 
                                  : ctx.strokeRect(noteX - noteWidth/2 - 40*imgScale, noteY - noteHeight/2, noteWidth + 80*imgScale, noteHeight);
                    ctx.stroke();

                    ctx.fillStyle = "#0dcaf0"; ctx.textBaseline = "middle"; ctx.textAlign = "center";
                    ctx.fillText(noteText, noteX, noteY);
                }

                // Cấu trúc tên file
                let prefixVal = document.getElementById("tab1-prefix").value.trim();
                let teamVal = document.getElementById("tab1-team").value.trim();
                let nameParts = [];
                if (prefixVal) nameParts.push(prefixVal);
                if (teamVal) nameParts.push(teamVal);
                if (rawNote) nameParts.push(rawNote);

                let combinedPrefix = nameParts.map(p => p.replace(/\s+/g, '_')).join('_').replace(/_+/g, '_');             
                let filePrefix = combinedPrefix ? combinedPrefix : "HT";

                const formatTime = (ts) => {
                    const d = new Date(ts);
                    return `${String(d.getHours()).padStart(2,'0')}${String(d.getMinutes()).padStart(2,'0')}${String(d.getSeconds()).padStart(2,'0')}`;
                };
                
                const timeBStr = formatTime(bObj.timestampMs);
                const timeAStr = formatTime(aObj.timestampMs);
                const timeNowStr = formatTime(Date.now());
                const dateStr = new Date().toISOString().slice(0,10).replace(/-/g, "");

                let finalName = `${filePrefix}_${dateStr}_${timeBStr}-${timeAStr}-${timeNowStr}.jpg`;

                const newItem = { 
                    id: "stitched_" + bObj.timestampMs + Math.floor(Math.random()*10), 
                    type: "STITCHED", name: finalName, 
                    dataUrl: stitchCanvas.toDataURL("image/jpeg", 0.85), 
                    timestampStr: new Date().toLocaleString("vi-VN") 
                };
                
                repoStitched.push(newItem); saveToDB(newItem);
                repoBefore = repoBefore.filter(x => x.id !== bObj.id); repoAfter = repoAfter.filter(x => x.id !== aObj.id);
                deleteFromDB(bObj.id); deleteFromDB(aObj.id);
                updateUIState();
                
                if (callback) callback();
                if (showAlert) {
                    renderPending(); renderGallery();
                    alert(`Đã ghép thành công:
${finalName}`);
                }
                resolve();
            });
        });
    }

    function saveToDB(item) { if (db) { db.transaction("photos", "readwrite").objectStore("photos").put(item); calculateStorageQuota(); } }
    
    function deleteFromDB(id) { if (db) { db.transaction("photos", "readwrite").objectStore("photos").delete(id); calculateStorageQuota(); } }
    
    function loadDataFromDB() {
        if (!db) return;
        let req = db.transaction("photos", "readonly").objectStore("photos").getAll();
        req.onsuccess = (e) => {
            const allData = e.target.result || [];
            repoBefore = allData.filter(x => x.type === "TRƯỚC").sort((a,b) => b.id.localeCompare(a.id));
            repoAfter = allData.filter(x => x.type === "SAU").sort((a,b) => b.id.localeCompare(a.id));
            repoStitched = allData.filter(x => x.type === "STITCHED").sort((a,b) => a.id.localeCompare(b.id));
            updateUIState();
        };
    }

    function updateUIState() {
        document.getElementById("pending-count").innerText = repoBefore.length + repoAfter.length;
        document.getElementById("gallery-count").innerText = repoStitched.length;
        document.getElementById("gallery-alert").style.display = (repoStitched.length > 0 || repoBefore.length > 0 || repoAfter.length > 0) ? "inline-block" : "none";
        calculateStorageQuota();
    }

    function renderPending() {
        const boxB = document.getElementById("list-before"); const boxA = document.getElementById("list-after");
        let htmlB = repoBefore.length === 0 ? '<div class="small text-muted p-2 text-center">Trống</div>' : '';
        repoBefore.forEach(item => {
            const tStr = new Date(item.timestampMs).toLocaleTimeString("vi-VN");
            htmlB += `<div class="photo-card mb-2" id="card_${item.id}"><input type="radio" name="radioBefore" value="${item.id}" class="form-check-input photo-radio"><img src="${item.dataUrl}" onclick="viewFullImage('${item.dataUrl}')"><div class="p-1 px-2 small text-secondary" style="font-size:10px;"><i class="fa-regular fa-clock me-1"></i> ${tStr}</div></div>`;
        }); boxB.innerHTML = htmlB;

        let htmlA = repoAfter.length === 0 ? '<div class="small text-muted p-2 text-center">Trống</div>' : '';
        repoAfter.forEach(item => {
            const tStr = new Date(item.timestampMs).toLocaleTimeString("vi-VN");
            htmlA += `<div class="photo-card mb-2" id="card_${item.id}"><input type="radio" name="radioAfter" value="${item.id}" class="form-check-input photo-radio"><img src="${item.dataUrl}" onclick="viewFullImage('${item.dataUrl}')"><div class="p-1 px-2 small text-secondary" style="font-size:10px;"><i class="fa-regular fa-clock me-1"></i> ${tStr}</div></div>`;
        }); boxA.innerHTML = htmlA;
    }

    function renderGallery() {
        const grid = document.getElementById("gallery-grid"); const emptyMsg = document.getElementById("gallery-empty-msg");
        document.getElementById("select-all-checkbox").checked = false; document.getElementById("selected-counter").innerText = "Đã chọn: 0";
        if (repoStitched.length === 0) { grid.innerHTML = ""; emptyMsg.classList.remove("d-none"); return; }
        emptyMsg.classList.add("d-none");
        let html = "";
        repoStitched.forEach(item => {
            html += `<div class="col-12 col-sm-6" id="card_${item.id}"><div class="photo-card stitched shadow-sm"><input type="checkbox" class="form-check-input photo-checkbox gallery-item-check" data-id="${item.id}" onchange="calculateSelection()"><img src="${item.dataUrl}" onclick="viewFullImage('${item.dataUrl}')"><div class="p-2"><div class="small fw-bold text-info text-break">${item.name}</div><div class="text-secondary" style="font-size:11px;">${item.timestampStr}</div></div></div></div>`;
        }); grid.innerHTML = html;
    }

    function calculateSelection() { document.getElementById("selected-counter").innerText = `Đã chọn: ${document.querySelectorAll(".gallery-item-check:checked").length}`; }
    function toggleSelectAll(master) { document.querySelectorAll(".gallery-item-check").forEach(cb => cb.checked = master.checked); calculateSelection(); }
    
    function deleteSelectedPhotos() {
        const checkedBoxes = document.querySelectorAll(".gallery-item-check:checked");
        if (checkedBoxes.length === 0) return alert("Vui lòng chọn ảnh!");
        if (confirm(`Xóa vĩnh viễn ${checkedBoxes.length} ảnh này?`)) {
            const ids = Array.from(checkedBoxes).map(cb => cb.getAttribute("data-id"));
            ids.forEach(id => deleteFromDB(id)); repoStitched = repoStitched.filter(item => !ids.includes(item.id));
            renderGallery(); updateUIState();
        }
    }
    
    async function shareSelectedPhotos() {
        const checkedBoxes = document.querySelectorAll(".gallery-item-check:checked");
        if (checkedBoxes.length === 0) return alert("Vui lòng chọn ảnh!");
        const selectedIds = Array.from(checkedBoxes).map(cb => cb.getAttribute("data-id"));
        const itemsToShare = repoStitched.filter(item => selectedIds.includes(item.id));

        if (navigator.canShare && navigator.share) {
            try {
                let filesArray = [];
                for (let item of itemsToShare) {
                    let arr = item.dataUrl.split(','), mime = arr[0].match(/:(.*?);/)[1], bstr = atob(arr[1]), n = bstr.length, u8 = new Uint8Array(n);
                    while(n--) u8[n] = bstr.charCodeAt(n);
                    filesArray.push(new File([new Blob([u8], {type:mime})], item.name, { type: "image/jpeg" }));
                }
                await navigator.share({ files: filesArray, title: 'Báo cáo PC Tuyên Quang' });
            } catch (err) { if (err.name !== "AbortError") triggerBatchDownloads(itemsToShare); }
        } else { triggerBatchDownloads(itemsToShare); }
    }
    
    function triggerBatchDownloads(items) {
        items.forEach((item, index) => {
            setTimeout(() => {
                const a = document.createElement('a'); a.href = item.dataUrl; a.download = item.name;
                document.body.appendChild(a); a.click(); document.body.removeChild(a);
            }, index * 300);
        });
    }
    function viewFullImage(url) { const w = window.open(); w.document.write(`<body style="margin:0; background:#000; display:flex; align-items:center; justify-content:center;"><img src="${url}" style="max-width:100%; max-height:100%;"></body>`); }
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
